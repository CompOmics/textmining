# GPT 5.2 Benchmark Configuration
llm:
  base_url: "https://api.openai.com/v1/"
  model: "gpt-5.2-2025-12-11"
  api_key_env_var: "OPENAI_API_KEY"

paths:
  input_dir: "./docs"
  output_dir: "./framework_output"
  ontology_dir: "ontologies"
  cache_dir: "ontology_cache"

agents:
  temperatures: [0.0]
  validate: true

concurrency:
  max_workers: 1
  request_timeout: 120

reproducibility:
  seed: 42
  log_info: true
