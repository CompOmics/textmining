datasets:
  manuscripts:
    type: file
    path: "{{ input_path }}"

default_model: "openai/llama-4-scout"

operations:
  - name: extract_technical
    type: map
    prompt: |
      You are a scientific metadata extraction agent specializing in mass spectrometry. Extract ONLY values EXPLICITLY stated in the text.

      This paper may describe multiple experimental techniques. Extract ONLY from sections describing the proteomics or mass spectrometry experiment. Ignore all other experimental contexts.

      FIELDS TO EXTRACT:
      - acquisition_method: MS acquisition strategy (DDA, DIA, PRM, SRM, targeted)
      - alkylation_reagent: Cysteine alkylation chemical in LC-MS sample prep ONLY (iodoacetamide, chloroacetamide, NEM). NOT fluorescent dyes (Cy2/Cy3/Cy5) used in 2D-DIGE — those are NOT alkylation reagents.
      - alkylation_concentration: Concentration of alkylation_reagent in LC-MS sample prep ONLY
      - cleavage_agent: Protease(s) used (trypsin, Lys-C, chymotrypsin, GluC)
      - collision_energy: Fragmentation energy (NCE, eV values)
      - enrichment_method: Enrichment technique (IMAC, TiO2, antibody, affinity)
      - fractionation_method: Pre-MS fractionation approach (SCX, high-pH, bRP, gel). 2D-DIGE gel separation is NOT LC-MS fractionation.
      - fragmentation_method: MS fragmentation type (HCD, CID, ETD, EThcD)
      - instrument: The PRIMARY LC-MS/MS mass spectrometer model (Q Exactive, Orbitrap Fusion, timsTOF, LTQ). NOT secondary instruments used for validation (e.g., MALDI-TOF used only for spot verification).
      - ionization_type: Ionization source of the primary LC-MS instrument (ESI, nanoESI, MALDI)
      - labeling: Quantification method (TMT, iTRAQ, SILAC, label-free)
      - mass_analyzer: Mass analyser type in the primary MS instrument (Orbitrap, Ion Trap, QTOF, Triple Quadrupole). Infer from instrument model if not stated explicitly (e.g. Q Exactive → Orbitrap).
      - ptm: Post-translational modifications searched (e.g. carbamidomethylation, oxidation, phosphorylation). List all fixed and variable modifications mentioned.
      - reduction_reagent: Disulfide reduction chemical (DTT, TCEP, BME)
      - reduction_concentration: Concentration of reduction reagent

      For EACH field output a 2-element list: [extracted_value, evidence_sentence].
      - Copy values EXACTLY as written in text
      - If not explicitly stated → ["unknown", ""]
      - VERBATIM values: the evidence sentence MUST contain the extracted value as a substring.
      - INFERRED values (e.g., labeling inferred as label-free when no labels are mentioned):
        prefix evidence with "inferred: " followed by a verbatim quote supporting the inference.
        Example: ["label-free", "inferred: No isobaric labels were used in this study."]
      - Complete ALL fields systematically.

      LABELING INFERENCE RULE:
      If no labeling or quantification strategy is mentioned anywhere in the text (no TMT, iTRAQ, SILAC, dimethyl labeling, ICAT, or other isobaric/metabolic labels), then the experiment is label-free. Extract "label-free" with evidence from any sentence describing the quantification or MS analysis approach. Do NOT leave labeling as "unknown".
      Also extract "label-free" if the text explicitly mentions "label-free", "LFQ", "spectral counting", "emPAI", or "intensity-based" quantification.

      TEXT:
      DOCUMENT ID: {{ input.id }}
      {{ input.text }}

      Return a JSON object with ALL fields present.
    output:
      mode: structured_output
      schema:
        acquisition_method: "list[str]"
        alkylation_reagent: "list[str]"
        alkylation_concentration: "list[str]"
        cleavage_agent: "list[str]"
        collision_energy: "list[str]"
        enrichment_method: "list[str]"
        fractionation_method: "list[str]"
        fragmentation_method: "list[str]"
        instrument: "list[str]"
        ionization_type: "list[str]"
        labeling: "list[str]"
        mass_analyzer: "list[str]"
        ptm: "list[str]"
        reduction_reagent: "list[str]"
        reduction_concentration: "list[str]"
    validate:
      - "len(output['instrument']) == 2"
      - "len(output['cleavage_agent']) == 2"
      - "len(output['labeling']) == 2"
      - "len(output['fragmentation_method']) == 2"
      - "output['instrument'][0] == 'unknown' or output['instrument'][1] != ''"
      - "output['cleavage_agent'][0] == 'unknown' or output['cleavage_agent'][1] != ''"
      - "output['labeling'][0] == 'unknown' or output['labeling'][1] != ''"
    num_retries_on_validate_failure: 2
    gleaning:
      num_rounds: 2
      # Only glean when a non-unknown field has empty evidence (fix missing evidence, not verify good extractions)
      if: "any(isinstance(v, list) and len(v) == 2 and v[0] not in ('unknown', '') and v[1] == '' for v in output.values())"
      validation_prompt: |
        You just extracted technical mass spectrometry metadata. Review your extraction:
        {{ output }}

        CRITICAL RULE: Evidence MUST NEVER be empty ("") for a non-unknown value. If you are about to set evidence to "", STOP — use "inferred: <best supporting quote>" instead.

        For EACH field with a non-unknown value, check against the paper text you saw:
        1. Evidence starting with "inferred: ": is the quoted text a VERBATIM quote that reasonably supports the inferred value? (e.g., "inferred: no labels used" → labeling "label-free" ✓)
        2. Evidence NOT starting with "inferred: ": does it contain the extracted value as a substring?
           - For concentrations/energies: the exact number and unit must appear verbatim.
           - If NO: add "inferred: " prefix to existing evidence. NEVER clear evidence to "".
           - WRONG: ["trypsin", ""] ← NEVER do this.
           - RIGHT: ["trypsin", "inferred: Samples were digested overnight with 1:100 trypsin."] ✓
        3. For "unknown" values: evidence should be "".
        4. Is evidence "" for any non-unknown field? Fix it using "inferred: <supporting sentence>".

        List each failing field and the specific issue. If ALL fields pass, say "VALID".

pipeline:
  steps:
    - name: technical_extraction
      input: manuscripts
      operations:
        - extract_technical
  output:
    type: file
    path: "{{ output_path }}"
